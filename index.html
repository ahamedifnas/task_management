<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timesheet Manager</title>
  <meta name="description" content="Overtime & Task-Based Timesheet Management System" />
  <meta id="theme-color" name="theme-color" content="#0f172a" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme')
        const theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'

        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
        document.getElementById('theme-color').content =
          theme === 'dark' ? '#0f172a' : '#f8fafc'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
